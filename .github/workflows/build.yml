name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']  # 语义化版本 tag（v1.0.0）→ 触发正式 Release
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    # Release 创建需要 contents:write（默认 GITHUB_TOKEN 只读）
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: code

      # 版本号来源：tag push 用 tag 名（去掉 v 前缀），快照构建用 gradle 里的 versionName
      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' code/app/build.gradle.kts)
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"
          # 快照 Release 名称只用 commit 首行并截断（GitHub Release name 上限 256 字符，
          # 之前把整段多行 commit message 塞进 name 导致 422 Validation Failed）
          COMMIT_TITLE=$(git log -1 --pretty=%s | head -c 200 | iconv -c -t UTF-8)
          echo "COMMIT_TITLE=$COMMIT_TITLE" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: code

      # ---- Release 签名构建 ----
      # keystore/密码/签名 hash 存于 GitHub Secrets（PF_STOREFILE_BASE64 等），
      # 本地构建则读 local.properties，两者互不依赖。
      - name: Decode release keystore
        run: echo "${{ secrets.PF_STOREFILE_BASE64 }}" | base64 -d > /tmp/pureframe-release.jks

      - name: Build Release APK (signed)
        env:
          PF_STOREFILE: /tmp/pureframe-release.jks
          PF_STOREPASSWORD: ${{ secrets.PF_STOREPASSWORD }}
          PF_KEYALIAS: ${{ secrets.PF_KEYALIAS }}
          PF_KEYPASSWORD: ${{ secrets.PF_KEYPASSWORD }}
          PF_SIGNING_SHA256: ${{ secrets.PF_SIGNING_SHA256 }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: code

      # AAB 只在正式（tag）构建时产出——Play 上架格式，快照无需白费时间
      - name: Build Release AAB (signed, release only)
        if: env.IS_RELEASE == 'true'
        env:
          PF_STOREFILE: /tmp/pureframe-release.jks
          PF_STOREPASSWORD: ${{ secrets.PF_STOREPASSWORD }}
          PF_KEYALIAS: ${{ secrets.PF_KEYALIAS }}
          PF_KEYPASSWORD: ${{ secrets.PF_KEYPASSWORD }}
          PF_SIGNING_SHA256: ${{ secrets.PF_SIGNING_SHA256 }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        working-directory: code

      # APK 改名带上版本号 + short SHA + 日期：
      # 正式版：pureframe-<ver>.apk（tag 构建）
      # 快照：  pureframe-debug-<ver>-<sha7>-<yyyymmdd>.apk / pureframe-release-...
      # 注意 mv 到原目录（不改变路径），否则后续步骤找不到文件
      - name: Rename APK with version info
        run: |
          APK=$(find code/app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_DIR=$(dirname "$APK")
          SHA7=$(git rev-parse --short=7 HEAD)
          DATE=$(date +%Y%m%d)
          if [ "$IS_RELEASE" = "true" ]; then
            DEST="pureframe-${VERSION}.apk"
            REL_DEST="pureframe-${VERSION}.apk"
          else
            DEST="pureframe-debug-${VERSION}-${SHA7}-${DATE}.apk"
            REL_DEST="pureframe-release-${VERSION}-${SHA7}-${DATE}.apk"
          fi
          mv "$APK" "$APK_DIR/$DEST"
          echo "APK_NAME=$DEST" >> $GITHUB_ENV
          echo "SHA7=$SHA7" >> $GITHUB_ENV
          echo "Renamed to: $APK_DIR/$DEST"

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pureframe-debug-${{ env.SHA7 }}
          path: code/app/build/outputs/apk/debug/${{ env.APK_NAME }}
          retention-days: 14

      - name: Rename Release APK with version info
        run: |
          APK=$(find code/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)
          APK_DIR=$(dirname "$APK")
          if [ "$IS_RELEASE" = "true" ]; then
            # 正式构建：release 签名包命名须与 debug 包区分（资产扁平化，同名会互相覆盖），
            # 与 Release body 文案一致：pureframe-release-<ver>.apk
            REL_DEST="pureframe-release-${VERSION}.apk"
          else
            DATE=$(date +%Y%m%d)
            REL_DEST="pureframe-release-${VERSION}-${SHA7}-${DATE}.apk"
          fi
          mv "$APK" "$APK_DIR/$REL_DEST"
          echo "RELEASE_APK_NAME=$REL_DEST" >> $GITHUB_ENV
          echo "Renamed release to: $APK_DIR/$REL_DEST"

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pureframe-release-${{ env.SHA7 }}
          path: code/app/build/outputs/apk/release/${{ env.RELEASE_APK_NAME }}
          retention-days: 14

      # 正式构建：AAB 改名并作为 artifact 留档（同时参与 Release 上传）
      - name: Rename Release AAB with version info
        if: env.IS_RELEASE == 'true'
        run: |
          AAB=$(find code/app/build/outputs/bundle/release -name "*.aab" | head -1)
          AAB_DIR=$(dirname "$AAB")
          AAB_DEST="pureframe-release-${VERSION}.aab"
          mv "$AAB" "$AAB_DIR/$AAB_DEST"
          echo "RELEASE_AAB_NAME=$AAB_DEST" >> $GITHUB_ENV
          echo "Renamed aab to: $AAB_DIR/$AAB_DEST"

      - name: Upload Release AAB (artifact)
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pureframe-release-aab-${{ env.SHA7 }}
          path: code/app/build/outputs/bundle/release/${{ env.RELEASE_AAB_NAME }}
          retention-days: 14

      # ---- 正式 Release（tag push：vX.Y.Z）----
      # 产物：pureframe-<ver>.apk（debug 构建产物）+ release 签名 APK + AAB + SHA256SUMS
      - name: Generate SHA-256 checksums
        if: env.IS_RELEASE == 'true'
        run: |
          cd code/app/build/outputs/apk/debug
          sha256sum "${{ env.APK_NAME }}" > "$GITHUB_WORKSPACE/SHA256SUMS"
          cd ../release
          sha256sum "${{ env.RELEASE_APK_NAME }}" >> "$GITHUB_WORKSPACE/SHA256SUMS"
          cd ../../bundle/release
          sha256sum "${{ env.RELEASE_AAB_NAME }}" >> "$GITHUB_WORKSPACE/SHA256SUMS"
          cat "$GITHUB_WORKSPACE/SHA256SUMS"

      - name: Create GitHub Release (tag)
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PureFrame ${{ env.VERSION }}
          body: |
            Official release build of PureFrame ${{ github.ref_name }}.

            - `pureframe-${{ env.VERSION }}.apk` — debug-signed build (sideload-friendly)
            - `pureframe-release-${{ env.VERSION }}.apk` — release-signed build
            - `pureframe-release-${{ env.VERSION }}.aab` — Android App Bundle (Google Play upload format)
            - `SHA256SUMS` — checksums for verifying your download

            See [CHANGELOG.md](https://github.com/ayukyo/pureframe/blob/main/CHANGELOG.md) for what's new.
          files: |
            code/app/build/outputs/apk/debug/${{ env.APK_NAME }}
            code/app/build/outputs/apk/release/${{ env.RELEASE_APK_NAME }}
            code/app/build/outputs/bundle/release/${{ env.RELEASE_AAB_NAME }}
            SHA256SUMS
          fail_on_unmatched_files: false
          make_latest: true

      # 推送到 main 时把 APK 作为快照 Release（tag: build-<sha>）持续替换发布，
      # 方便手机直接从 Releases 页下载安装，无需登录 GitHub 拉 artifact
      - name: Upload snapshot to GitHub Releases
        if: env.IS_RELEASE == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SHA7 }}
          name: 阶段性构建 ${{ env.SHA7 }} (${{ env.COMMIT_TITLE }})
          body: |
            自动构建于 push 到 main（commit ${{ github.sha }}）

            提交信息：${{ github.event.head_commit.message }}
          files: |
            code/app/build/outputs/apk/debug/${{ env.APK_NAME }}
            code/app/build/outputs/apk/release/${{ env.RELEASE_APK_NAME }}
          fail_on_unmatched_files: false
          make_latest: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: code

      - name: Run Lint
        # 历史遗留 lint 错误不阻塞 CI（报告照常上传供查看）；APK 构建 job 才是主产物
        run: ./gradlew lintDebug --no-daemon || echo "lint found issues (non-blocking)"
        working-directory: code

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: code/app/build/reports/lint-results-debug.*
          retention-days: 7
