name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    # Release 创建需要 contents:write（默认 GITHUB_TOKEN 只读）
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: code

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: code

      # ---- Release 签名构建 ----
      # keystore/密码/签名 hash 存于 GitHub Secrets（PF_STOREFILE_BASE64 等），
      # 本地构建则读 local.properties，两者互不依赖。
      - name: Decode release keystore
        run: echo "${{ secrets.PF_STOREFILE_BASE64 }}" | base64 -d > /tmp/pureframe-release.jks

      - name: Build Release APK (signed)
        env:
          PF_STOREFILE: /tmp/pureframe-release.jks
          PF_STOREPASSWORD: ${{ secrets.PF_STOREPASSWORD }}
          PF_KEYALIAS: ${{ secrets.PF_KEYALIAS }}
          PF_KEYPASSWORD: ${{ secrets.PF_KEYPASSWORD }}
          PF_SIGNING_SHA256: ${{ secrets.PF_SIGNING_SHA256 }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: code

      # APK 改名带上 short SHA + 日期，形成"阶段性快照"版本：
      # pureframe-debug-1.0.0-<sha7>-<yyyymmdd>.apk
      # 注意 mv 到原目录（不改变路径），否则后续步骤找不到文件
      - name: Rename APK with version info
        run: |
          APK=$(find code/app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_DIR=$(dirname "$APK")
          SHA7=$(git rev-parse --short=7 HEAD)
          DATE=$(date +%Y%m%d)
          DEST="pureframe-debug-1.0.0-${SHA7}-${DATE}.apk"
          mv "$APK" "$APK_DIR/$DEST"
          echo "APK_NAME=$DEST" >> $GITHUB_ENV
          echo "SHA7=$SHA7" >> $GITHUB_ENV
          echo "Renamed to: $APK_DIR/$DEST"

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pureframe-debug-${{ env.SHA7 }}
          path: code/app/build/outputs/apk/debug/${{ env.APK_NAME }}
          retention-days: 14

      - name: Rename Release APK with version info
        run: |
          APK=$(find code/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)
          APK_DIR=$(dirname "$APK")
          DATE=$(date +%Y%m%d)
          DEST="pureframe-release-1.0.0-${SHA7}-${DATE}.apk"
          mv "$APK" "$APK_DIR/$DEST"
          echo "RELEASE_APK_NAME=$DEST" >> $GITHUB_ENV
          echo "Renamed release to: $APK_DIR/$DEST"

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pureframe-release-${{ env.SHA7 }}
          path: code/app/build/outputs/apk/release/${{ env.RELEASE_APK_NAME }}
          retention-days: 14

      # 推送到 main 时把 APK 作为 Release（tag: build-<date>-<sha>）持续替换发布，
      # 方便手机直接从 Releases 页下载安装，无需登录 GitHub 拉 artifact
      - name: Upload to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SHA7 }}
          name: 阶段性构建 ${{ env.SHA7 }} (${{ github.event.head_commit.message }})
          body: |
            自动构建于 push 到 main（commit ${{ github.sha }}）

            提交信息：${{ github.event.head_commit.message }}
          files: |
            code/app/build/outputs/apk/debug/${{ env.APK_NAME }}
            code/app/build/outputs/apk/release/${{ env.RELEASE_APK_NAME }}
          fail_on_unmatched_files: false
          make_latest: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: code

      - name: Run Lint
        # 历史遗留 lint 错误不阻塞 CI（报告照常上传供查看）；APK 构建 job 才是主产物
        run: ./gradlew lintDebug --no-daemon || echo "lint found issues (non-blocking)"
        working-directory: code

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: code/app/build/reports/lint-results-debug.*
          retention-days: 7
